<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Autorização — Achadeira do Lar</title>
<style>
  :root{--bg:#fbf6f0;--ink:#2b2420;--muted:#7a6d64;--brand:#c8553d;--card:#fff;--line:#eadfd4}
  @media (prefers-color-scheme: dark){:root{--bg:#1c1816;--ink:#f3ebe4;--muted:#b3a79d;--brand:#e07a5f;--card:#26211e;--line:#3a322d}}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:640px;margin:0 auto;padding:40px 16px}
  h1{font-size:1.3rem} .muted{color:var(--muted)}
  pre{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<main>
<h1>Autorização recebida</h1>
<p class="muted">Página de retorno do aplicativo interno da Achadeira do Lar. Pode fechar esta aba.</p>
<pre id="out">—</pre>
</main>
<script>
const p = new URLSearchParams(location.search);
const out = {};
for (const [k, v] of p) out[k] = v;
document.getElementById('out').textContent = Object.keys(out).length ? JSON.stringify(out, null, 2) : 'Nenhum parâmetro recebido.';
</script>
</body>
</html>
